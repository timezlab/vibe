name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Agent Skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Agent Skills validator
        run: python -m pip install --disable-pip-version-check "skills-ref==0.1.1"

      - name: Validate all skills
        shell: bash
        run: |
          set -euo pipefail

          skill_count="$(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)"
          if [[ "$skill_count" -eq 0 ]]; then
            echo "No skills/<name>/SKILL.md files found." >&2
            exit 1
          fi

          while IFS= read -r -d '' skill_file; do
            skill_dir="$(dirname "$skill_file")"
            echo "::group::Validating $skill_dir"
            agentskills validate "$skill_dir"
            echo "::endgroup::"
          done < <(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print0 | sort -z)
